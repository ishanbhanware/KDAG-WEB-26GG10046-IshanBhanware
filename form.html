<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <ul>
        <li class="navregister"><a href="form.html">[register now]</a></li>
        <li><a href="index.html#curriculum">[curriculum]</a></li>
        <li><a href="index.html#about">[about]</a></li>
        </ul>
    </div>
    <main class="form-container">
        <div class="form-card" id="form">
            <h1>REGISTER <span class="highlight">NOW</span></h1>
            <h3>Name:</h3>
            <input type="text" id="name" placeholder="Enter your name">
            <h3>Roll Number:</h3>
            <input type="text" id="rollnumber" placeholder="Enter your roll number">
            <h3>Email:</h3>
            <input type="email" id="email" placeholder="Enter your email">
            <h3>Department:</h3>
            <select id="department">
                <option value="">Select your department</option>
                <option value="CSE">Computer Science & Engineering</option>
                <option value="ECE">Electronics & Communication Engineering</option>
                <option value="EE">Electrical Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="MA">Mathematics & Computing</option>
                <option value="OTHER">Other</option>
            </select>
            <button id="submit" class="register">[register now]</button>
        </div>
        <div class="form-card" style="display: none;" id="success">
            <h1>REGISTRATION SUCCESSFUL! WELCOME TO THE BOOTCAMP</h1>
            <h2>DETAILS</h2>
            <div class="details">
                <div class="detailelem">
                    <p>Date: 29th September</p>
                </div>
                <div class="detailelem">
                    <p>Venue: Vikramshila</p>
                </div>
                <div class="detailelem">
                    <p>Pre Requisites: None</p>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
