<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register now</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <ul>
        <li class="navregister"><a href="form.html">[register now]</a></li>
        <li><a href="index.html#curriculum">[curriculum]</a></li>
        <li><a href="index.html#about">[about]</a></li>
        </ul>
    </div>
    <main class="signup-container">
    <div class="signup-card">
      <form id="registrationForm" class="signup-form" novalidate>
        <h2>Register Now</h2>
        <p class="subtitle">Beginner's Python & Data Analytics Bootcamp</p>

        <div id="errorMessage" class="error-banner" style="display: none;"></div>

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname"/>
        </div>

        <div class="form-group">
          <label for="rollNumber">Roll Number</label>
          <input type="text" id="rollNumber" maxlength="9" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email"/>
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department">
            <option value="">Select Department</option>
            <option value="CSE">Computer Science & Engineering</option>
            <option value="ECE">Electronics & ECE</option>
            <option value="EE">Electrical Engineering</option>
            <option value="ME">Mechanical Engineering</option>
            <option value="MA">Mathematics & Computing</option>
            <option value="OTHER">Other</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Register</button>
      </form>

      <div id="successMessage" class="success-card" style="display: none;">
        <div class="success-icon">✓</div>
        <h2>Registration Successful!</h2>
        <p>Welcome to the Bootcamp.</p>
      </div>

    </div>
    
</body>
<script src="script.js"></script>
</html>
